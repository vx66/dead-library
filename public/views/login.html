<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEAD SMILE LIBRARY - Acceso Admin</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="terminal-overlay"></div>

  <div class="login-wrap">
    <h2>acceso restringido<span class="cursor"></span></h2>
    <form id="loginForm">
      <div class="form-group">
        <label for="username">usuario</label>
        <input type="text" id="username" name="username" required autocomplete="username" placeholder="usuario" maxlength="100">
      </div>
      <div class="form-group">
        <label for="password">contraseña</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="·········">
      </div>
      <button type="submit" class="btn primary" style="width:100%;">entrar</button>
    </form>
    <div id="loginError" style="color:var(--danger); margin-top:1rem; display:none;"></div>
  </div>

  <script src="/js/login.js"></script>
</body>
</html>
