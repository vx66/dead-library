<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEAD SMILE LIBRARY</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="terminal-overlay"></div>

  <header>
    <a href="/" class="brand">DEAD SMILE LIBRARY</a>
    <nav class="nav">
      <button class="theme-toggle" id="themeToggle" title="Cambiar tema">tema: <span id="themeLabel">oscuro</span></button>
    </nav>
  </header>

  <div class="container">
    <section class="hero">
      <div class="rotary" id="rotaryText"></div>
      <p class="sub">Biblioteca clandestina de archivos de DEAD SMILE</p>
    </section>

    <section class="catalog">
      <div class="catalog-header">
        <div>
          <h2 id="catTitle">biblioteca de archivos</h2>
          <div id="fileCount">cargando catálogo...</div>
        </div>
        <div class="controls">
          <select id="orderSelect" class="form-select">
            <option value="desc">últimos subidos</option>
            <option value="asc">primeros subidos</option>
            <option value="alpha">alfabético</option>
          </select>
          <select id="catSelect" class="form-select">
            <option value="">todas las categorías</option>
          </select>
        </div>
      </div>

      <div class="cat-filters" id="catFilters"></div>

      <div class="grid" id="catalogGrid"></div>

      <div class="empty-state" id="emptyState" style="display:none;">
        <p>no hay archivos en esta categoría.</p>
      </div>
    </section>
  </div>

  <div class="footer">
    dead smile library &copy; xergno
  </div>

  <script src="/js/main.js"></script>
</body>
</html>
